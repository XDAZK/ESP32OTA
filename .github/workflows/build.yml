name: Build ESP32 Firmware

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Generate Version & Build Firmware
        run: |
          VERSION=$(date +'%Y.%m.%d.%H%M%S')
          echo "Building firmware version: $VERSION"
          export PLATFORMIO_BUILD_FLAGS="-D CURRENT_FIRMWARE_VERSION='\"$VERSION\"'"
          pio run

          mkdir -p docs
          cp .pio/build/esp32dev/firmware.bin docs/firmware.bin

          cat > docs/latest.json << EOF
          {
            "version": "$VERSION",
            "firmware": "https://xdazk.github.io/ESP32OTA/firmware.bin"
          }
          EOF

      - name: Commit OTA Files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/firmware.bin
          git add docs/latest.json

          git commit -m "Auto OTA Build" || exit 0

          git push
