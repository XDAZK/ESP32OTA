name: ESP32 OTA Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install platformio

      - run: pio run

      - name: Generate Version
        run: |
          VERSION=$(date +'%Y.%m.%d.%H%M%S')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: .pio/build/esp32dev/firmware.bin

      - name: Generate latest.json
        run: |
          mkdir -p metadata
          cat > metadata/latest.json << EOF
          {
            "version": "${{ env.VERSION }}",
            "firmware": "https://github.com/XDAZK/ESP32OTA/releases/latest/download/firmware.bin"
          }
          EOF

      - name: Commit latest.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add metadata/latest.json
          git commit -m "Update latest.json" || echo "No changes"
          git push
